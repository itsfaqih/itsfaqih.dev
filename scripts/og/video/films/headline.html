<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Headline</title>
    <link rel="stylesheet" href="../film.css" />
    <style>
      .bar {
        position: absolute;
        inset: 0 0 auto;
        height: 12px;
        background: var(--ux);
      }
      .top {
        position: absolute;
        top: 64px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .live {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--go);
      }
      .live i {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        background: var(--ts);
      }
      .domain {
        color: var(--dim);
      }
      .title {
        position: absolute;
        left: 72px;
        top: 128px;
        width: 1056px;
        font-family: var(--display);
        font-weight: 900;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      /* A track clips its line so words roll through it; the extra bottom room keeps descenders. */
      .track {
        position: relative;
        height: 1.16em;
        margin-bottom: -0.16em;
        overflow: hidden;
      }
      .track > span {
        position: absolute;
        left: 0;
        top: 0;
        white-space: pre;
        will-change: transform;
      }
      .line3 {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-end;
        margin-top: 0.04em;
      }
      .hl {
        position: relative;
        height: 1.08em;
        margin-left: -10px;
        clip-path: inset(0 0 -0.16em 0);
        background: var(--ux);
        color: var(--on-accent);
      }
      .hl > span {
        position: absolute;
        left: 10px;
        top: -0.02em;
        white-space: pre;
      }
      .lede {
        position: absolute;
        left: 72px;
        top: 486px;
        font-size: 34px;
        color: var(--dim);
        white-space: nowrap;
      }
      .ticker {
        position: absolute;
        left: 0;
        bottom: 0;
        display: flex;
        white-space: nowrap;
        will-change: transform;
      }
      .ticker > div {
        padding: 0 28px;
        line-height: 76px;
        color: var(--on-accent);
        font-family: var(--display);
        font-weight: 900;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bar" id="bar"></div>
      <div class="top mono">
        <div class="live"><i></i>Full-stack engineer · Indonesia</div>
        <div class="domain">itsfaqih.dev</div>
      </div>
      <div class="title">
        <div>I build</div>
        <div class="track" id="phrases"></div>
        <div class="line3">
          <div class="hl" id="hl"></div>
          <div>.</div>
        </div>
      </div>
      <div class="lede">Faqih Muntashir, full-stack engineer with 5+ years on web products.</div>
      <div class="ticker" id="ticker"></div>
    </div>
    <script src="../vendor/gsap.min.js"></script>
    <script src="../film.js"></script>
    <script src="dots.js"></script>
    <script>
      // src/data/home.ts SLIDES, with the dark palette's hex for each hue.
      const SLIDES = [
        {
          ticker: "INTERFACES",
          hue: "#ff6ad5",
          phrase: "interfaces that",
          highlight: "feel right",
        },
        {
          ticker: "AGENTIC SETUPS",
          hue: "#4dd4ff",
          phrase: "agents that",
          highlight: "finish the job",
        },
        { ticker: "DEV TOOLS", hue: "#ffb02e", phrase: "dev tools that", highlight: "save hours" },
        {
          ticker: "SYSTEM DESIGN",
          hue: "#7dff6a",
          phrase: "systems that",
          highlight: "run reliably",
        },
        { ticker: "TESTS", hue: "#bca2ff", phrase: "test suites you", highlight: "can trust" },
      ];
      const SLIDE = 2.4;
      const T = SLIDE * SLIDES.length;
      const SWAP = 0.62; // a swap ends exactly on the slide boundary

      const phrases = document.getElementById("phrases");
      const hl = document.getElementById("hl");
      const bar = document.getElementById("bar");
      const ticker = document.getElementById("ticker");

      const phraseEls = SLIDES.map((s) => {
        const el = document.createElement("span");
        el.textContent = s.phrase;
        phrases.append(el);
        return el;
      });
      const hlEls = SLIDES.map((s) => {
        const el = document.createElement("span");
        el.textContent = s.highlight;
        hl.append(el);
        return el;
      });
      for (let r = 0; r < 3; r++)
        for (const s of SLIDES) {
          const tile = document.createElement("div");
          tile.textContent = `${s.ticker} ★`;
          tile.style.background = s.hue;
          ticker.append(tile);
        }

      document.fonts.ready.then(() => {
        const widths = hlEls.map((el) => el.getBoundingClientRect().width + 20);
        const run = [...ticker.children]
          .slice(0, SLIDES.length)
          .reduce((w, el) => w + el.getBoundingClientRect().width, 0);

        const expoOut = gsap.parseEase("expo.out");
        const inEase = gsap.parseEase("power2.in");
        const inOut = gsap.parseEase("power3.inOut");
        const n = SLIDES.length;
        const OUT_AT = SLIDE - SWAP;

        // The light in the bottom-right corner is on from frame 0 and takes each slide's hue as its words
        // start to leave, done before the slide ends, so the loop closes.
        const dots = createDots(document.querySelector(".stage"), { loop: T });
        // The ticker covers the frame's bottom edge, so the light sits in the corner just above it.
        const tickerTop = ticker.getBoundingClientRect().top;
        const corner = { ...CORNER, top: tickerTop - 1, bottom: tickerTop };
        const lights = [
          { since: -Infinity, hue: SLIDES[0].hue },
          ...SLIDES.map((_, i) => ({ since: i * SLIDE + OUT_AT, hue: SLIDES[(i + 1) % n].hue })),
        ];
        register({
          duration: T,
          frame: (time) => {
            const t = ((time % T) + T) % T;
            const s = Math.floor(t / SLIDE) % n;
            const u = t - s * SLIDE;
            const next = (s + 1) % n;
            // Exits ease in over 0.26 s; entrances ease out over 0.5 s, starting as the exit clears.
            const out = (lag) => prog(u, OUT_AT + lag, 0.26, inEase);
            const inn = (lag) => prog(u, OUT_AT + lag + 0.16, 0.5, expoOut);
            const place = (els, lag) =>
              els.forEach((el, i) => {
                let y = 110;
                if (i === s) y = out(lag) >= 1 ? 110 : -110 * out(lag);
                if (i === next && u >= OUT_AT + lag + 0.16) y = 110 * (1 - inn(lag));
                el.style.transform = `translateY(${y}%)`;
              });
            place(phraseEls, 0);
            place(hlEls, 0.08);
            const w = widths[s] + (widths[next] - widths[s]) * prog(u, OUT_AT + 0.08, 0.5, inOut);
            hl.style.width = `${w}px`;
            // The new hue rises from the bottom with the new words, a hard edge, never a blend.
            const p = prog(u, OUT_AT + 0.24, 0.34, gsap.parseEase("power3.out"));
            const pct = (p * 100).toFixed(2);
            hl.style.background = `linear-gradient(to top, ${SLIDES[next].hue} ${pct}%, ${SLIDES[s].hue} ${pct}%)`;
            bar.style.backgroundColor = p >= 0.5 ? SLIDES[next].hue : SLIDES[s].hue;
            ticker.style.transform = `translateX(${-(t / T) * run}px)`;
            dots(
              t,
              fadeGlows(lights, t).map((g) => ({
                el: corner,
                reach: 560,
                hue: g.hue,
                weight: g.weight,
                on: -Infinity,
              })),
            );
          },
        });
      });
    </script>
  </body>
</html>
