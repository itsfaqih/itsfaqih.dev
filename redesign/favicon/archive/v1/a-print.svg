<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<style>
.t{fill:#f5f5f8}.i{fill:#111117}.is{stroke:#111117;fill:none}.h{fill:#e0389f}.m{mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.t{fill:#0e0e13}.i{fill:#f4f4f8}.is{stroke:#f4f4f8}.h{fill:#ff6ad5}.m{mix-blend-mode:screen}}
</style>
<defs><pattern id="ht" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle class="h" cx="1.6" cy="1.6" r="1.15"/></pattern></defs>
<rect class="t" width="32" height="32" rx="7"/>
<g transform="translate(2.5 2)" fill="url(#ht)" class="m"><rect x="4" y="12" width="14" height="14"/><circle cx="20" cy="11" r="7"/></g>
<circle class="h m" cx="20" cy="11" r="7"/>
<rect class="i" x="4" y="12" width="14" height="14"/>
</svg>
