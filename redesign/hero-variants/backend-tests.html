<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Primitives: backends and tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0e13; --panel: #17171f; --panel-2: #20202b; --hair: #2c2c3a;
    --text: #f4f4f8; --dim: #a1a1b5; --go: #ffe14d;
    --ux: #ff6ad5; --cw: #4dd4ff; --ar: #ffb02e; --ts: #7dff6a; --ax: #9d7bff;
    --shade: rgb(0 0 0 / 0.45);
    --display: "Unbounded", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --inout: cubic-bezier(0.65, 0, 0.35, 1);
    --fall: cubic-bezier(0.55, 0, 1, 0.45);
    color-scheme: dark;
  }
  .light {
    --bg: #f5f5f8; --panel: #ffffff; --panel-2: #ececf2; --hair: #d6d6df;
    --text: #111117; --dim: #4b4b5b; --shade: rgb(30 30 60 / 0.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "Geist", system-ui, sans-serif; }
  .ctl { display: flex; gap: 8px; padding: 16px clamp(16px, 4vw, 48px) 0; max-width: 1240px; margin: 0 auto; }
  .ctl button { font: 700 12px var(--display); padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--panel-2); color: var(--text); box-shadow: 0 3px 0 var(--hair); }
  .ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hair); }
  main { padding: 0 clamp(16px, 4vw, 48px) 64px; max-width: 1240px; margin: 0 auto; }
  section { padding-top: 32px; }
  section h2 { margin: 0 0 16px; font: 800 clamp(18px, 2.4vw, 24px)/1.25 var(--display); }
  section h2 b { color: var(--c); font-weight: 800; }
  .light section h2 b { color: color-mix(in oklab, var(--c) 70%, black); }
  .row { display: grid; gap: 24px 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  figure { margin: 0; }
  figcaption { margin-top: 9px; font: 500 12.5px var(--mono); color: var(--dim); }
  figcaption b { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px; border-radius: 6px;
    background: var(--go); color: #111; font: 800 10px var(--display); }

  .stage { perspective: 900px; }
  .card { position: relative; aspect-ratio: 16 / 10; transform-style: preserve-3d; transform: rotateX(4deg) rotateY(-6deg); }
  .card > * { position: absolute; inset: 0; border-radius: 14px; }
  .card .paper { border: 1px solid var(--hair);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      var(--panel);
    background-blend-mode: overlay, normal; }
  .card svg { width: 100%; height: 100%; transform: translateZ(30px); clip-path: inset(0 round 14px); display: block; overflow: hidden; }
  .card .drop { transform: translateZ(-1px) translateY(10px); background: var(--shade); filter: blur(14px); opacity: .7; }
  svg *:not([transform]) { transform-box: fill-box; transform-origin: center; }
  /* Elements that turn or scale around a fixed point in the scene. */
  .card .vb { transform-box: view-box; }
  .paused .card * { animation-play-state: paused !important; }

  .h { fill: var(--c); } .i { fill: var(--text); }
  .hs { stroke: var(--c); fill: none; } .is { stroke: var(--text); fill: none; }
  .mis { mix-blend-mode: screen; }
  .light .mis { mix-blend-mode: multiply; }
  .dot { fill: var(--c); }
  .grid { stroke: var(--c); stroke-width: 0.6; opacity: 0.26; fill: none; }
  .ghost { stroke-dasharray: 3 4; stroke-width: 1.4; opacity: .65; }

  .settle { animation: settle 4.4s calc(var(--i, 0) * 120ms) infinite backwards; }
  @keyframes settle {
    0%, 6% { transform: translate(var(--dx), var(--dy)) rotate(var(--r, 0deg)); animation-timing-function: var(--spring); }
    24%, 80% { transform: none; animation-timing-function: var(--inout); }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r, 0deg)); }
  }


  /* ---- Backends A: retry. The first try bounces off the gate, the backoff ring fills, the second try goes through. ---- */
  .ra-ball { animation: ra-ball 4.4s infinite; }
  @keyframes ra-ball {
    0% { opacity: 0; transform: none; }
    4% { opacity: 1; transform: none; animation-timing-function: var(--fall); }
    14% { transform: translateX(128px); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    24%, 50% { transform: translateX(50px); animation-timing-function: var(--inout); }
    66%, 86% { opacity: 1; transform: translateX(233px); }
    94%, 100% { opacity: 0; transform: translateX(233px); }
  }
  .ra-wait { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ra-wait 4.4s infinite; }
  @keyframes ra-wait {
    0%, 23% { stroke-dashoffset: 1; opacity: 1; }
    48% { stroke-dashoffset: 0; opacity: 1; }
    54%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .ra-gate { animation: ra-gate 4.4s infinite; }
  @keyframes ra-gate {
    0%, 48% { transform: none; animation-timing-function: var(--spring); }
    56%, 90% { transform: translateY(-62px); animation-timing-function: var(--inout); }
    98%, 100% { transform: none; }
  }
  .ra-miss { animation: ra-miss 4.4s infinite; }
  @keyframes ra-miss {
    0%, 13% { opacity: 0; transform: scale(0.3); animation-timing-function: var(--spring); }
    18%, 86% { opacity: 1; transform: none; }
    94%, 100% { opacity: 0; transform: none; }
  }
  .ra-hit { animation: ra-hit 4.4s infinite; }
  @keyframes ra-hit {
    0%, 64% { opacity: 0; transform: scale(0.2); animation-timing-function: var(--spring); }
    72%, 86% { opacity: 1; transform: none; }
    94%, 100% { opacity: 0; transform: none; }
  }

  /* ---- Backends B: the queue steps forward one slot per beat, circles in, squares out. ---- */
  .rb-item { opacity: 0; animation: rb-item 4.5s var(--d) linear infinite; }
  .rb-work { animation: rb-work 0.9s infinite; }
  @keyframes rb-work {
    0%, 36% { transform: scale(0.72); animation-timing-function: var(--spring); }
    50% { transform: scale(1); animation-timing-function: var(--inout); }
    100% { transform: scale(0.72); }
  }
  .rb-out { opacity: 0; animation: rb-out 0.9s infinite; }
  @keyframes rb-out {
    0%, 44% { opacity: 0; transform: none; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    52% { opacity: 1; }
    100% { opacity: 0; transform: translateX(34px); }
  }

  /* ---- Backends C: exponential backoff. Hops double until one lands. ---- */
  .rc-x { animation: rc-x 5s infinite; }
  @keyframes rc-x {
    0% { opacity: 0; transform: none; }
    4% { opacity: 1; transform: none; animation-timing-function: linear; }
    6% { transform: none; animation-timing-function: linear; }
    16%, 26% { transform: translateX(30px); animation-timing-function: linear; }
    42%, 54% { transform: translateX(90px); animation-timing-function: linear; }
    78%, 90% { opacity: 1; transform: translateX(210px); }
    96%, 100% { opacity: 0; transform: translateX(210px); }
  }
  .rc-y { animation: rc-y 5s infinite; }
  @keyframes rc-y {
    0%, 6% { transform: none; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
    11% { transform: translateY(-24px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
    16%, 26% { transform: none; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
    34% { transform: translateY(-44px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
    42%, 54% { transform: none; animation-timing-function: cubic-bezier(0.2, 0.6, 0.4, 1); }
    66% { transform: translateY(-76px); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
    78%, 100% { transform: none; }
  }
  /* ---- Tests A: one bar regresses past the line, gets flagged, and is pushed back. ---- */
  .card .ta-bar { animation: ta-bar 4.8s infinite; }
  @keyframes ta-bar {
    0%, 18% { transform: none; animation-timing-function: var(--spring); }
    28%, 58% { transform: scaleY(2.3); animation-timing-function: var(--spring); }
    70%, 100% { transform: none; }
  }
  .ta-flag { opacity: 0; animation: ta-flag 4.8s infinite; }
  @keyframes ta-flag { 0%, 22% { opacity: 0; } 28%, 60% { opacity: 1; } 68%, 100% { opacity: 0; } }

  /* ---- Tests B: snapshot diff. The scan finds the shape that slipped; it snaps back. ---- */
  .tb-slip { animation: tb-slip 5s infinite; }
  @keyframes tb-slip {
    0%, 10% { transform: none; animation-timing-function: var(--inout); }
    18%, 58% { transform: translate(12px, -14px) rotate(16deg); animation-timing-function: var(--spring); }
    68%, 100% { transform: none; }
  }
  .tb-scan { animation: tb-scan 5s infinite; }
  @keyframes tb-scan {
    0%, 20% { opacity: 0; transform: none; animation-timing-function: linear; }
    22% { opacity: 1; }
    50% { opacity: 1; transform: translateX(280px); }
    52%, 100% { opacity: 0; transform: translateX(280px); }
  }
  .tb-neq { animation: tb-neq 5s infinite; }
  @keyframes tb-neq { 0%, 14% { opacity: 0; } 20%, 62% { opacity: 1; } 68%, 100% { opacity: 0; } }

  /* ---- Tests C: a bug wanders, gets boxed in, and becomes one more test in the row. ---- */
  .card .tc-bug { transform: translate(160px, 84px); animation: tc-bug 5.2s infinite; }
  @keyframes tc-bug {
    0% { opacity: 0; transform: translate(96px, 58px) rotate(-20deg); }
    4% { opacity: 1; transform: translate(96px, 58px) rotate(-20deg); animation-timing-function: var(--inout); }
    12% { transform: translate(222px, 44px) rotate(30deg); animation-timing-function: var(--inout); }
    20% { transform: translate(112px, 118px) rotate(-40deg); animation-timing-function: var(--inout); }
    28% { transform: translate(232px, 104px) rotate(10deg); animation-timing-function: var(--inout); }
    38% { transform: translate(160px, 84px) rotate(0deg); }
    50% { opacity: 1; transform: translate(160px, 84px); animation-timing-function: var(--inout); }
    56%, 100% { opacity: 0; transform: translate(160px, 84px) scale(0.2); }
  }
  .tc-box { animation: tc-box 5.2s infinite; }
  @keyframes tc-box {
    0%, 37% { opacity: 0; transform: scale(1.9); animation-timing-function: var(--spring); }
    45%, 54% { opacity: 1; transform: none; }
    60%, 100% { opacity: 0; transform: none; }
  }
  .tc-new { animation: tc-new 5.2s infinite; }
  @keyframes tc-new {
    0%, 52% { opacity: 0; transform: translate(-71px, -91px) scale(1.6); animation-timing-function: var(--inout); }
    56% { opacity: 1; transform: translate(-71px, -91px) scale(1.6); animation-timing-function: var(--inout); }
    70%, 88% { opacity: 1; transform: none; }
    96%, 100% { opacity: 0; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card * { animation: none !important; }
    .ra-ball { transform: translateX(233px); }
    .ra-wait, .tc-box, .ta-flag, .rb-out { opacity: 0; }
    .ra-gate { transform: translateY(-62px); }
    .rb-item { opacity: 1; transform: translateX(var(--x)); }
    .pop { opacity: 1; }
    .tc-bug, .ta-reg, .tb-reg, .tb-neq { opacity: 0; }
    .rc-x { transform: translateX(210px); }
    .tb-scan { opacity: 0; }
  }

</style>
</head>
<body>
<div class="ctl">
  <button id="theme" type="button">Light</button>
  <button id="pause" type="button">Pause</button>
</div>
<main id="root"></main>

<script>
const defs = (p) => `<defs>
  <pattern id="${p}ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle class="dot" cx="2.5" cy="2.5" r="1.75"/></pattern>
  <pattern id="${p}gr" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0 H0 V16"/></pattern>
</defs><rect width="320" height="200" fill="url(#${p}gr)"/>`;
// One primitive printed in two inks: a misregistered halftone in the hue, then the top ink.
const ink = (p, shape, top = "i") => {
  const topG = top === "i" ? `<g class="i">${shape}</g>` : top === "h" ? `<g class="h mis">${shape}</g>` : `<g class="is" stroke-width="3">${shape}</g>`;
  return `<g transform="translate(5 4)" fill="url(#${p}ht)" class="mis">${shape}</g>${topG}`;
};
// A mark that springs in at s% of the loop, holds until e%, and fades before the restart.
const popCss = [];
const pop = (name, s, e) => popCss.push(`@keyframes ${name} {
  0%, ${s}% { opacity: 0; transform: scale(0.3) rotate(-45deg); animation-timing-function: var(--spring); }
  ${s + 8}%, ${e}% { opacity: 1; transform: none; }
  ${e + 8}%, 100% { opacity: 0; transform: none; } }`);
const reg = (x, y, cls, anim) => `<g class="pop ${cls}" style="animation:${anim}"><circle class="hs" stroke-width="1.8" cx="${x}" cy="${y}" r="8"/><path class="hs" stroke-width="1.8" d="M${x - 14} ${y} H${x + 14} M${x} ${y - 14} V${y + 14}"/></g>`;
const cross = (x, y, anim) => `<path class="hs pop" style="animation:${anim}" stroke-width="3" stroke-linecap="round" d="M${x - 7} ${y - 7} L${x + 7} ${y + 7} M${x + 7} ${y - 7} L${x - 7} ${y + 7}"/>`;

// The queue: each item walks in, steps one slot per beat, and goes into the worker on the fifth beat.
const QX = [-20, 54, 96, 138, 180, 262];
{
  const stops = [];
  for (let j = 0; j < 4; j++) {
    stops.push(`${20 * j}% { opacity: ${j ? 1 : 0}; transform: translateX(${QX[j]}px); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }`);
    stops.push(`${20 * j + 9}% { opacity: 1; transform: translateX(${QX[j + 1]}px); }`);
  }
  stops.push(`80% { opacity: 1; transform: translateX(${QX[4]}px); animation-timing-function: var(--inout); }`);
  stops.push(`89% { opacity: 1; transform: translateX(${QX[5]}px) scale(0.5); }`);
  stops.push(`94%, 100% { opacity: 0; transform: translateX(${QX[5]}px) scale(0.5); }`);
  popCss.push(`@keyframes rb-item { ${stops.join(" ")} }`);
}
pop("rc-m1", 15, 88); pop("rc-m2", 41, 88); pop("rc-ok", 77, 88);
pop("ta-reg", 28, 58); pop("tb-reg", 44, 58);
document.head.insertAdjacentHTML("beforeend", `<style>${popCss.join("\n")}</style>`);

const SCENES = [
  {
    c: "var(--ts)", phrase: "backends that ", hi: "run reliably",
    options: [
      ["Retry", (p) => `${defs(p)}
        <path class="is" stroke-width="3" d="M16 151.5 H304"/>
        <path class="is ghost" d="M164 118 Q 128 80 92 118"/>
        ${ink(p, `<circle cx="40" cy="138" r="15"/>`, "o")}
        <g class="ra-gate">${ink(p, `<rect x="180" y="96" width="10" height="54"/>`, "h")}</g>
        ${cross(150, 70, "ra-miss 4.4s infinite").replace('class="hs pop"', 'class="hs ra-miss"')}
        ${ink(p, `<rect x="257" y="118" width="32" height="32"/>`, "o")}
        <rect class="h mis ra-hit" x="261" y="122" width="24" height="24"/>
        <g class="ra-ball">${ink(p, `<circle cx="40" cy="138" r="12"/>`)}
          <circle class="is ra-wait" stroke-width="2.4" pathLength="1" cx="40" cy="138" r="20" transform="rotate(-90 40 138)"/></g>`],
      ["Queue", (p) => `${defs(p)}
        ${QX.slice(1, 5).map((x) => `<rect class="is ghost" x="${x - 14}" y="110" width="28" height="28"/>`).join("")}
        <path class="is ghost" d="M200 124 H226 M220 118 L226 124 L220 130"/>
        ${ink(p, `<rect x="230" y="92" width="64" height="64"/>`, "o")}
        <rect class="h mis rb-work" x="246" y="108" width="32" height="32"/>
        <rect class="i rb-out" x="298" y="119" width="10" height="10"/>
        ${[0, 1, 2, 3, 4].map((k) => `<g class="rb-item" style="--d:${-k * 0.9}s;--x:${[54, 96, 138, 180, -40][k]}px">${ink(p, `<circle cx="0" cy="124" r="11"/>`, k === 2 ? "h" : "i")}</g>`).join("")}
        <path class="is" stroke-width="3" d="M16 165.5 H304"/>`],
      ["Backoff", (p) => `${defs(p)}
        <path class="is ghost" d="M40 148 Q55 100 70 148 M70 148 Q100 60 130 148 M130 148 Q190 -4 250 148"/>
        <path class="is" stroke-width="3" d="M16 159.5 H304"/>
        ${ink(p, `<rect x="234" y="161" width="32" height="8"/>`, "h")}
        ${cross(70, 180, "rc-m1 5s infinite")}${cross(130, 180, "rc-m2 5s infinite")}
        <circle class="hs pop" style="animation:rc-ok 5s infinite" stroke-width="2.6" cx="250" cy="148" r="20"/>
        <g class="rc-x"><g class="rc-y">${ink(p, `<circle cx="40" cy="148" r="10"/>`)}</g></g>`],
    ],
  },
  {
    c: "var(--ax)", phrase: "test suites you ", hi: "can trust",
    options: [
      ["Regression", (p) => {
        const hs = [44, 52, 40, 58, 48, 50, 46, 54];
        return `${defs(p)}
        <path class="hs" stroke-width="1.8" stroke-dasharray="5 4" d="M20 96 H300"/>
        ${hs.map((h, k) => {
          const x = 36 + k * 32, bar = `<rect x="${x}" y="${168 - h}" width="18" height="${h}"/>`;
          return k === 5
            ? `<g class="vb ta-bar" style="transform-origin:${x + 9}px 168px">${ink(p, bar)}<g class="h ta-flag">${bar}</g></g>`
            : ink(p, bar);
        }).join("")}
        <path class="is" stroke-width="3" d="M16 169.5 H304"/>
        ${reg(205, 34, "ta-reg", "ta-reg 4.8s infinite")}`;
      }],
      ["Snapshot diff", (p) => {
        const comp = (x0, slip) => {
          const sq = ink(p, `<rect x="${x0 + 62}" y="92" width="34" height="34"/>`);
          return `${ink(p, `<circle cx="${x0 + 40}" cy="74" r="18"/>`, "h")}
            ${slip ? `<g class="tb-slip">${sq}</g>` : sq}
            ${ink(p, `<rect x="${x0 + 16}" y="146" width="92" height="8"/>`)}`;
        };
        return `${defs(p)}
        <rect class="is ghost" x="20" y="34" width="124" height="132"/><rect class="is ghost" x="176" y="34" width="124" height="132"/>
        ${comp(20, false)}${comp(176, true)}
        <path class="is" stroke-width="3" d="M152 94 H168 M152 104 H168"/>
        <path class="hs tb-neq" stroke-width="3" stroke-linecap="round" d="M165 86 L155 112"/>
        <rect class="h tb-scan" x="20" y="26" width="3" height="148"/>
        ${reg(267, 95, "tb-reg", "tb-reg 5s infinite")}`;
      }],
      ["Bug to test", (p) => `${defs(p)}
        ${[0, 1, 2, 3, 4].map((k) => ink(p, `<rect x="${82 + k * 28}" y="166" width="18" height="18"/>`)).join("")}
        <rect class="is ghost" x="222" y="166" width="18" height="18"/>
        <g class="tc-new">${ink(p, `<rect x="222" y="166" width="18" height="18"/>`, "h")}</g>
        <g class="vb tc-bug"><g transform="scale(1.5)"><path class="is" stroke-width="2" stroke-linecap="round" d="M-8 -1 L-17 -5 M8 -1 L17 -5 M-10 6 L-18 8 M10 6 L18 8"/>${ink(p, `<path d="M-12 10 H12 L0 -13 Z"/>`, "h")}</g></g>
        <path class="is tc-box" stroke-width="3" d="M128 66 V54 H140 M180 54 H192 V66 M192 102 V114 H180 M140 114 H128 V102"/>`],
    ],
  },
];

let uid = 0;
document.getElementById("root").innerHTML = SCENES.map((s) => `
  <section style="--c:${s.c}">
    <h2>I build ${s.phrase}<b>${s.hi}</b>.</h2>
    <div class="row">${s.options.map(([name, draw], k) => `
      <figure>
        <div class="stage"><div class="card"><div class="drop"></div><div class="paper"></div>
          <svg viewBox="0 0 320 200" aria-hidden="true">${draw(`u${uid++}-`)}</svg></div></div>
        <figcaption><b>${"ABC"[k]}</b>${name}</figcaption>
      </figure>`).join("")}</div>
  </section>`).join("");

const html = document.documentElement;
const themeBtn = document.getElementById("theme");
const setTheme = (light) => { html.classList.toggle("light", light); themeBtn.textContent = light ? "Dark" : "Light"; };
setTheme(new URLSearchParams(location.search).get("theme") === "light");
themeBtn.onclick = () => setTheme(!html.classList.contains("light"));
let paused = false;
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => { paused = !paused; document.body.classList.toggle("paused", paused); pauseBtn.textContent = paused ? "Play" : "Pause"; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Every card turns toward the cursor, closing 12% of the gap each frame. */
const REST = { x: 4, y: -6 };
const cards = [...document.querySelectorAll(".card")].map((el) => ({ el, now: { ...REST }, to: { ...REST } }));
if (!reduced) {
  let frame = 0;
  const clamp = (v) => Math.max(-1, Math.min(1, v));
  const tick = () => {
    let moving = false;
    for (const c of cards) {
      c.now.x += (c.to.x - c.now.x) * 0.12;
      c.now.y += (c.to.y - c.now.y) * 0.12;
      if (Math.abs(c.to.x - c.now.x) > 0.01 || Math.abs(c.to.y - c.now.y) > 0.01) moving = true;
      c.el.style.transform = `rotateX(${c.now.x.toFixed(2)}deg) rotateY(${c.now.y.toFixed(2)}deg)`;
    }
    frame = moving ? requestAnimationFrame(tick) : 0;
  };
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    for (const c of cards) {
      const r = c.el.parentElement.getBoundingClientRect();
      const dx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth / 2));
      const dy = clamp((e.clientY - (r.top + r.height / 2)) / (innerHeight / 2));
      c.to = { x: REST.x - dy * 10, y: REST.y + dx * 14 };
    }
    if (!frame) frame = requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
