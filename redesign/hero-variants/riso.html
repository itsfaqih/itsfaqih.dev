<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero illustrations: Riso print</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0e13; --panel: #17171f; --panel-2: #20202b; --hair: #2c2c3a;
    --text: #f4f4f8; --dim: #a1a1b5;
    --ux: #ff6ad5; --cw: #4dd4ff; --ar: #ffb02e; --ts: #7dff6a; --ax: #9d7bff;
    --shade: rgb(0 0 0 / 0.45);
    --display: "Unbounded", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  .light {
    --bg: #f5f5f8; --panel: #ffffff; --panel-2: #ececf2; --hair: #d6d6df;
    --text: #111117; --dim: #4b4b5b; --shade: rgb(30 30 60 / 0.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "Geist", system-ui, sans-serif; }
  .ctl { display: flex; gap: 8px; padding: 16px clamp(16px, 4vw, 48px) 0; max-width: 1180px; margin: 0 auto; }
  .ctl button { font: 700 12px var(--display); padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--panel-2); color: var(--text); box-shadow: 0 3px 0 var(--hair); }
  .ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hair); }
  main { padding: 20px clamp(16px, 4vw, 48px) 64px; max-width: 1180px; margin: 0 auto;
    display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font: 500 13px var(--mono); color: var(--dim); }
  figcaption b { color: var(--c); font-weight: 600; }
  .light figcaption b { color: color-mix(in oklab, var(--c) 70%, black); }

  /* A tilting card: the paper, then the print 30px above it. */
  .stage { perspective: 900px; }
  .card { position: relative; aspect-ratio: 16 / 10; transform-style: preserve-3d; transform: rotateX(4deg) rotateY(-6deg); }
  .card > * { position: absolute; inset: 0; border-radius: 14px; }
  .card .paper { border: 1px solid var(--hair);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      var(--panel);
    background-blend-mode: overlay, normal; }
  .card svg { width: 100%; height: 100%; transform: translateZ(30px); clip-path: inset(0 round 14px); display: block; }
  .card .drop { transform: translateZ(-1px) translateY(10px); background: var(--shade); filter: blur(14px); opacity: .7; }
  svg *:not([transform]) { transform-box: fill-box; transform-origin: center; }
  .paused .card * { animation-play-state: paused !important; }

  /* Inks: the slide hue (halftone, misregistered) and the text colour on top. */
  .h { fill: var(--c); } .i { fill: var(--text); }
  .hs { stroke: var(--c); fill: none; } .is { stroke: var(--text); fill: none; }
  .mis { mix-blend-mode: screen; }
  .light .mis { mix-blend-mode: multiply; }
  .dot { fill: var(--c); }
  .grid { stroke: var(--c); stroke-width: 0.6; opacity: 0.26; fill: none; }
  .spec { font: 500 8px var(--mono); fill: var(--text); opacity: 0.75; }
  .word { font: 600 11px var(--mono); fill: var(--text); text-anchor: middle; dominant-baseline: central; }
  .disp { font-family: var(--display); font-weight: 800; }

  /* 1. Feel right: the oversized glyphs tumble, snap onto the baseline, get stamped. */
  .c1-u { animation: c1-u 4.4s infinite; }
  .c1-i { animation: c1-i 4.4s infinite; }
  @keyframes c1-u {
    0%, 6% { transform: translate(-10px, -26px) rotate(-24deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    22%, 80% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    100% { transform: translate(-10px, -26px) rotate(-24deg); }
  }
  @keyframes c1-i {
    0%, 10% { transform: translate(20px, -14px) rotate(32deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    26%, 82% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    100% { transform: translate(20px, -14px) rotate(32deg); }
  }
  .c1-snap { opacity: 0; animation: c1-snap 4.4s infinite; }
  @keyframes c1-snap { 0%, 26% { opacity: 0; } 29%, 78% { opacity: 1; } 82%, 100% { opacity: 0; } }
  .c1-seal { animation: c1-seal 4.4s infinite; }
  @keyframes c1-seal {
    0%, 30% { opacity: 0; transform: scale(1.8) rotate(-14deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    36% { opacity: 1; transform: scale(0.94) rotate(-14deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    41%, 78% { opacity: 1; transform: scale(1) rotate(-14deg); }
    84%, 100% { opacity: 0; transform: scale(1) rotate(-14deg); }
  }

  /* 2. Finish the job: the asterisk ratchets, the loop lights each step, then "done". */
  .c2-rot { transform-box: view-box; transform-origin: 160px 100px; animation: c2-rot 0.9s infinite; }
  @keyframes c2-rot { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); } 45%, 100% { transform: rotate(60deg); } }
  .c2-orbit { transform-box: view-box; transform-origin: 160px 100px; animation: spin 3.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .c2-hi { opacity: 0; animation: c2-hi 3.6s calc(var(--i) * 0.9s) infinite; }
  @keyframes c2-hi { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }

  /* 3. Save hours: the hands spin back four hours, the bar collapses, "−4h" lands. */
  .c3-min { transform-box: view-box; transform-origin: 100px 100px; animation: c3-min 4.4s infinite; }
  @keyframes c3-min { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 44%, 100% { transform: rotate(-1440deg); } }
  .c3-hr { transform-box: view-box; transform-origin: 100px 100px; animation: c3-hr 4.4s infinite; }
  @keyframes c3-hr { 0% { transform: rotate(120deg); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 44%, 88% { transform: rotate(0); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 100% { transform: rotate(120deg); } }
  .card .c3-bar { transform-origin: 0 50%; animation: c3-bar 4.4s infinite; }
  @keyframes c3-bar { 0% { transform: scaleX(1); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 44%, 88% { transform: scaleX(0.08); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 100% { transform: scaleX(1); } }
  .c3-stamp { animation: c3-stamp 4.4s infinite; }
  @keyframes c3-stamp {
    0%, 44% { opacity: 0; transform: scale(1.7) rotate(-7deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    50% { opacity: 1; transform: scale(0.95) rotate(-7deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    54%, 86% { opacity: 1; transform: scale(1) rotate(-7deg); }
    92%, 100% { opacity: 0; transform: scale(1) rotate(-7deg); }
  }

  /* 4. Scale quietly: servers ease in one by one until the rack is full; alerts stay at 0. */
  .c4-srv { animation: c4-srv 4.8s calc(var(--i) * 130ms) infinite backwards; }
  @keyframes c4-srv {
    0% { opacity: 0; transform: translateY(6px) scale(0.92); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    7%, 76% { opacity: 1; transform: none; }
    84%, 100% { opacity: 0; transform: none; }
  }
  .c4-led { animation: c4-led 1.6s calc(var(--i) * -170ms) infinite; }
  @keyframes c4-led { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 5. Can trust: the check draws itself across the poster, then the pass stamp lands. */
  .c5-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: c5-draw 4.6s infinite; }
  @keyframes c5-draw {
    0%, 6% { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    28%, 84% { stroke-dashoffset: 0; opacity: 1; }
    92%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .c5-ht { animation: c5-ht 4.6s infinite; }
  @keyframes c5-ht { 0%, 14% { opacity: 0; } 30%, 84% { opacity: 1; } 92%, 100% { opacity: 0; } }
  .c5-run { opacity: 0; animation: c5-run 4.6s calc(var(--i) * 140ms) infinite; }
  @keyframes c5-run { 0%, 4% { opacity: 0; } 6%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
  .c5-stamp { animation: c5-stamp 4.6s infinite; }
  @keyframes c5-stamp {
    0%, 32% { opacity: 0; transform: scale(1.7) rotate(-6deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    38% { opacity: 1; transform: scale(0.95) rotate(-6deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    42%, 84% { opacity: 1; transform: scale(1) rotate(-6deg); }
    90%, 100% { opacity: 0; transform: scale(1) rotate(-6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card * { animation: none !important; }
    .c1-snap, .c5-run { opacity: 1; }
    .c5-draw { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="ctl">
  <button id="theme" type="button">Light</button>
  <button id="pause" type="button">Pause</button>
</div>
<main id="root"></main>

<script>
const SLIDES = [
  { c: "var(--ux)", phrase: "interfaces that ", hi: "feel right" },
  { c: "var(--cw)", phrase: "agents that ", hi: "finish the job" },
  { c: "var(--ar)", phrase: "dev tools that ", hi: "save hours" },
  { c: "var(--ts)", phrase: "backends that ", hi: "scale quietly" },
  { c: "var(--ax)", phrase: "test suites you ", hi: "can trust" },
];

const defs = (p) => `<defs>
  <pattern id="${p}ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle class="dot" cx="2.5" cy="2.5" r="1.75"/></pattern>
  <pattern id="${p}fine" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle class="dot" cx="2" cy="2" r="1.05"/></pattern>
  <pattern id="${p}gr" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0 H0 V16"/></pattern>
</defs><rect width="320" height="200" fill="url(#${p}gr)"/>`;
// Crop marks in the four corners of the sheet.
const crops = () => [[10, 10, 1, 1], [310, 10, -1, 1], [10, 190, 1, -1], [310, 190, -1, -1]]
  .map(([x, y, dx, dy]) => `<path class="hs" stroke-width="1.2" d="M${x + dx * 9} ${y} H${x} V${y + dy * 9}"/>`).join("");
// Two-ink type: the hue copy sits a few px off the text-ink copy.
const ink = (t, x, y, size, cls = "", off = [4, 3]) =>
  `<g class="${cls}"><text class="disp h mis" x="${x + off[0]}" y="${y + off[1]}" font-size="${size}">${t}</text><text class="disp i" x="${x}" y="${y}" font-size="${size}">${t}</text></g>`;

const scenes = [
  // Interfaces that feel right.
  (p) => `${defs(p)}
    <rect x="160" y="34" width="174" height="110" fill="url(#${p}ht)"/>
    <text class="spec" x="20" y="22">kerning ✓  radius 6 ✓  focus ring ✓  60fps ✓</text>
    ${ink("U", 20, 186, 184, "c1-u", [6, 4])}
    ${ink("I", 162, 186, 184, "c1-i", [6, 4])}
    <path class="hs c1-snap" stroke-width="1.4" stroke-dasharray="3 3" d="M0 186.5 H320"/>
    <g class="c1-seal">
      <circle cx="276" cy="156" r="27" class="is" stroke-width="2.5"/>
      <circle cx="279" cy="159" r="27" class="hs mis" stroke-width="2.5"/>
      <path d="M264 156 l8 8 l16 -18" class="is" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    ${crops()}`,

  // Agents that finish the job.
  (p) => {
    const bars = [0, 60, 120].map((a) => `<rect x="146" y="38" width="28" height="124" rx="14" transform="rotate(${a} 160 100)"/>`).join("");
    const words = [["plan", 52, 30], ["run", 268, 30], ["check", 268, 170], ["ship", 52, 170]];
    return `${defs(p)}
    <circle cx="160" cy="100" r="86" class="is" stroke-width="1.2" stroke-dasharray="2 5" opacity=".6"/>
    <g class="c2-orbit"><circle cx="160" cy="14" r="6" class="h"/></g>
    <g class="c2-rot"><g fill="url(#${p}ht)" transform="translate(6 5)">${bars}</g><g class="is" stroke-width="2.6">${bars}</g></g>
    ${words.map(([w, x, y], i) => `<rect class="h c2-hi" style="--i:${i}" x="${x - 30}" y="${y - 11}" width="60" height="22" rx="3"/><text class="word" x="${x}" y="${y}">${w}</text>`).join("")}`;
  },

  // Dev tools that save hours.
  (p) => {
    const ticks = Array.from({ length: 12 }, (_, i) => `<rect x="98.5" y="${i % 3 ? 22 : 20}" width="3" height="${i % 3 ? 8 : 14}" rx="1.5" class="i" transform="rotate(${i * 30} 100 100)"/>`).join("");
    return `${defs(p)}
    <circle cx="106" cy="106" r="86" fill="url(#${p}ht)"/>
    <circle cx="100" cy="100" r="86" class="is" stroke-width="3"/>${ticks}
    <g class="c3-hr"><rect x="95.5" y="56" width="9" height="48" rx="4.5" class="i"/></g>
    <g class="c3-min"><rect x="97.5" y="30" width="5" height="74" rx="2.5" class="i"/></g>
    <circle cx="100" cy="100" r="7" class="h"/>
    <g class="c3-stamp">${ink("−4h", 196, 84, 47)}</g>
    <text class="spec" x="200" y="120">build, before</text>
    <rect x="200" y="126" width="104" height="12" class="is" stroke-width="1.5"/>
    <rect x="200" y="126" width="104" height="12" class="h c3-bar"/>
    <text class="spec" x="200" y="156">build, after</text>
    <rect x="200" y="162" width="104" height="12" class="is" stroke-width="1.5" stroke-dasharray="2 3" opacity=".5"/>
    <rect x="200" y="162" width="9" height="12" class="h"/>`;
  },

  // Backends that scale quietly.
  (p) => {
    let rack = "";
    for (let j = 0; j < 3; j++) for (let k = 0; k < 4; k++) {
      const x = 14 + k * 74, y = 30 + j * 52, n = j * 4 + k;
      rack += `<g class="c4-srv" style="--i:${n}">
        <rect x="${x + 4}" y="${y + 4}" width="66" height="42" rx="5" fill="url(#${p}ht)"/>
        <rect x="${x}" y="${y}" width="66" height="42" rx="5" class="is" stroke-width="2"/>
        <circle class="h c4-led" style="--i:${n}" cx="${x + 12}" cy="${y + 14}" r="4"/>
        <circle class="i" cx="${x + 12}" cy="${y + 28}" r="2.5" opacity=".5"/>
        <path class="is" stroke-width="2" stroke-linecap="round" d="M${x + 28} ${y + 13} H${x + 56} M${x + 28} ${y + 21} H${x + 56} M${x + 28} ${y + 29} H${x + 48}"/>
      </g>`;
    }
    return `${defs(p)}
    <text class="spec" x="14" y="20">replicas 1 → 12</text>
    <text class="spec" x="306" y="20" text-anchor="end">alerts 0 · pages 0</text>
    ${rack}`;
  },

  // Test suites you can trust.
  (p) => {
    const check = "M30 100 L112 170 L298 18";
    const runs = Array.from({ length: 5 }, (_, i) => `<text class="spec c5-run" style="--i:${i}" x="20" y="${26 + i * 12}">run ${i + 1}  15/15 ✓</text>`).join("");
    return `${defs(p)}
    <path d="${check}" transform="translate(8 7)" stroke="url(#${p}ht)" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round" class="c5-ht"/>
    <path d="${check}" pathLength="1" class="is c5-draw" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    ${runs}
    <g class="c5-stamp">
      <rect x="182" y="136" width="120" height="44" rx="4" class="is" stroke-width="3"/>
      <rect x="186" y="140" width="120" height="44" rx="4" class="hs mis" stroke-width="3"/>
      <text class="disp i" x="194" y="166" font-size="17">0 FLAKY</text>
    </g>`;
  },
];

document.getElementById("root").innerHTML = scenes.map((scene, i) => `
  <figure style="--c:${SLIDES[i].c}">
    <div class="stage"><div class="card">
      <div class="drop"></div><div class="paper"></div>
      <svg viewBox="0 0 320 200" aria-hidden="true">${scene(`s${i}-`)}</svg>
    </div></div>
    <figcaption>I build ${SLIDES[i].phrase}<b>${SLIDES[i].hi}</b>.</figcaption>
  </figure>`).join("");

const html = document.documentElement;
const themeBtn = document.getElementById("theme");
const setTheme = (light) => { html.classList.toggle("light", light); themeBtn.textContent = light ? "Dark" : "Light"; };
setTheme(new URLSearchParams(location.search).get("theme") === "light");
themeBtn.onclick = () => setTheme(!html.classList.contains("light"));
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => { const on = document.body.classList.toggle("paused"); pauseBtn.textContent = on ? "Play" : "Pause"; };

/* Each card turns toward the cursor, closing 12% of the gap each frame. */
const REST = { x: 4, y: -6 };
const cards = [...document.querySelectorAll(".card")].map((el) => ({ el, now: { ...REST }, to: { ...REST } }));
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let frame = 0;
  const clamp = (v) => Math.max(-1, Math.min(1, v));
  const tick = () => {
    let moving = false;
    for (const c of cards) {
      c.now.x += (c.to.x - c.now.x) * 0.12;
      c.now.y += (c.to.y - c.now.y) * 0.12;
      if (Math.abs(c.to.x - c.now.x) > 0.01 || Math.abs(c.to.y - c.now.y) > 0.01) moving = true;
      c.el.style.transform = `rotateX(${c.now.x.toFixed(2)}deg) rotateY(${c.now.y.toFixed(2)}deg)`;
    }
    frame = moving ? requestAnimationFrame(tick) : 0;
  };
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    for (const c of cards) {
      const r = c.el.parentElement.getBoundingClientRect();
      const dx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth / 2));
      const dy = clamp((e.clientY - (r.top + r.height / 2)) / (innerHeight / 2));
      c.to = { x: REST.x - dy * 10, y: REST.y + dx * 14 };
    }
    if (!frame) frame = requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
