<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero illustrations: pick a direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500;600&family=Silkscreen&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0e13; --panel: #17171f; --panel-2: #20202b; --hair: #2c2c3a;
    --text: #f4f4f8; --dim: #a1a1b5; --go: #ffe14d; --ink: #0e0e13;
    --ux: #ff6ad5; --cw: #4dd4ff; --ar: #ffb02e; --ts: #7dff6a; --ax: #9d7bff;
    --shade: rgb(0 0 0 / 0.45);
    --display: "Unbounded", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    --snap: cubic-bezier(0.34, 1.56, 0.64, 1);
    color-scheme: dark;
  }
  .light {
    --bg: #f5f5f8; --panel: #ffffff; --panel-2: #ececf2; --hair: #d6d6df;
    --text: #111117; --dim: #4b4b5b; --shade: rgb(30 30 60 / 0.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "Geist", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 48px); background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hair); }
  header h1 { margin: 0; font: 700 clamp(15px, 2vw, 18px)/1.2 var(--display); }
  .ctl { display: flex; gap: 8px; }
  .ctl button { font: 700 12px var(--display); padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--panel-2); color: var(--text); box-shadow: 0 3px 0 var(--hair); }
  .ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hair); }
  main { padding: 8px clamp(16px, 4vw, 48px) 80px; max-width: 1360px; margin: 0 auto; }
  section { padding-top: 40px; }
  section h2 { margin: 0; font: 800 clamp(22px, 3vw, 30px)/1.1 var(--display); }
  section h2 b { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; margin-right: 10px; border-radius: 10px; background: var(--go); color: #111; font-size: 0.7em; vertical-align: 0.12em; }
  section > p { margin: 8px 0 20px; color: var(--dim); max-width: 68ch; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font: 500 13px var(--mono); color: var(--dim); }
  figcaption b { color: var(--text); font-weight: 600; }

  /* ---- Card: a tilting stage, its ground, the art 30px above it ---- */
  .stage { perspective: 900px; }
  .card { position: relative; aspect-ratio: 16 / 10; transform-style: preserve-3d; transform: rotateX(4deg) rotateY(-6deg); }
  .card > * { position: absolute; inset: 0; border-radius: 14px; }
  .card .bg { border: 1px solid var(--hair); overflow: hidden; }
  .card svg { width: 100%; height: 100%; transform: translateZ(30px); clip-path: inset(0 round 14px); display: block; }
  .card .fx { transform: translateZ(31px); pointer-events: none; }
  .card .shadow-drop { transform: translateZ(-1px) translateY(10px); background: var(--shade); filter: blur(14px); opacity: .7; }
  svg *:not([transform]) { transform-box: fill-box; transform-origin: center; }
  .paused .card * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { .card * { animation: none !important; } }

  /* ================= A. Toybox ================= */
  .va .bg { background: radial-gradient(120% 95% at 50% 18%, color-mix(in oklab, var(--c) 24%, var(--panel)), color-mix(in oklab, var(--c) 7%, var(--bg))); }
  .s-hl { stop-color: color-mix(in oklab, var(--c) 40%, white); } .s-h { stop-color: var(--c); } .s-hd { stop-color: color-mix(in oklab, var(--c) 52%, black); }
  .s-wl { stop-color: #ffffff; } .s-w { stop-color: #e6e6ee; } .s-wd { stop-color: #a4a4b7; }
  .s-kl { stop-color: #5c5c70; } .s-k { stop-color: #2c2c38; } .s-kd { stop-color: #121218; }
  .va .floor { fill: var(--shade); }
  .eye { fill: #0e0e13; }
  .lbl { font: 700 10px var(--display); fill: #0e0e13; text-anchor: middle; dominant-baseline: central; }

  .a1-drop { transform-origin: 50% 100%; animation: a1-drop 4.8s calc(var(--i) * 260ms) infinite backwards; }
  @keyframes a1-drop {
    0% { transform: translateY(-170px); opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    3% { opacity: 1; }
    11% { transform: translateY(0) scale(1.12, 0.8); animation-timing-function: cubic-bezier(0.3, 1.12, 0.4, 1); }
    17% { transform: translateY(0) scale(1); }
    80% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    90%, 100% { transform: translateY(-24px); opacity: 0; }
  }
  .a2-g1 { animation: spin 9s linear infinite; }
  .a2-g2 { animation: spin 6s linear infinite reverse; }
  .a2-g3 { animation: spin 3.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .a2-blink { transform-origin: 50% 50%; animation: blink 3.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

  .a3-flip { animation: a3-flip 3.6s infinite; }
  @keyframes a3-flip { 0%, 72% { transform: rotate(0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); } 84%, 100% { transform: rotate(180deg); } }
  .a3-top { transform-origin: 50% 100%; animation: a3-top 3.6s linear infinite; }
  @keyframes a3-top { 0% { transform: scale(1); } 70%, 100% { transform: scale(0); } }
  .a3-bot { transform-origin: 50% 100%; animation: a3-bot 3.6s linear infinite; }
  @keyframes a3-bot { 0% { transform: scale(0.05); } 70%, 100% { transform: scale(1); } }
  .a3-stream { animation: a3-stream 3.6s infinite; }
  @keyframes a3-stream { 0%, 68% { opacity: 1; } 70%, 100% { opacity: 0; } }
  .a3-glass { fill: rgb(255 255 255 / 0.1); stroke: rgb(255 255 255 / 0.55); stroke-width: 2; }
  .light .a3-glass { fill: rgb(255 255 255 / 0.5); stroke: rgb(30 30 60 / 0.3); }
  .a3-coin { animation: a3-coin 3.6s infinite; }
  @keyframes a3-coin {
    0%, 80% { opacity: 0; transform: translateY(14px) scale(0.5); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    88% { opacity: 1; transform: translateY(0) scale(1); }
    96% { opacity: 1; transform: translateY(-4px); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  .a4-ball { transform-box: view-box; transform-origin: 0 0; transform: translateX(160px); animation: a4-ball 1.9s infinite; }
  @keyframes a4-ball {
    0% { transform: translateX(-40px); animation-timing-function: cubic-bezier(0.33, 0.55, 0.2, 1); }
    72%, 100% { transform: translateX(380px); }
  }
  .a4-body { animation: a4-body 1.9s infinite; }
  @keyframes a4-body { 0% { transform: scale(1); } 10%, 56% { transform: scale(1.32, 0.8); } 72%, 100% { transform: scale(1); } }
  .a4-lines { opacity: 0; animation: a4-lines 1.9s infinite; }
  @keyframes a4-lines { 0%, 100% { opacity: 0; } 8%, 62% { opacity: 1; } 72% { opacity: 0; } }

  .a5-plank { transform-box: view-box; transform-origin: 160px 138px; animation: a5-tip 1.7s ease-in-out infinite alternate; }
  @keyframes a5-tip { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .a5-tower { transform-box: view-box; transform-origin: 160px 130px; animation: a5-wob 1.7s 180ms ease-in-out infinite alternate backwards; }
  @keyframes a5-wob { from { transform: rotate(5deg); } to { transform: rotate(-5deg); } }
  .a5-top { transform-box: view-box; transform-origin: 160px 96px; animation: a5-wob 1.7s 320ms ease-in-out infinite alternate backwards; }

  /* ================= B. Pixel arcade ================= */
  .vb svg { shape-rendering: crispEdges; }
  .vb .bg { background: #000; }
  .vb .fx { background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.16) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .light .vb .fx { background: repeating-linear-gradient(to bottom, rgb(30 30 60 / 0.06) 0 1px, transparent 1px 3px); }
  .pk { fill: #0e0e13; } .pc { fill: var(--c); } .pl { fill: color-mix(in oklab, var(--c) 45%, white); } .pd { fill: color-mix(in oklab, var(--c) 50%, black); }
  .pw { fill: #f4f4f8; } .py { fill: #ffe14d; } .ps { fill: #f4f4f8; }
  .light .ps { fill: color-mix(in oklab, var(--c) 55%, #1a1a24); }
  .sky { fill: color-mix(in oklab, var(--c) 18%, #0e0e13); }
  .far { fill: color-mix(in oklab, var(--c) 30%, #0e0e13); }
  .mid { fill: color-mix(in oklab, var(--c) 42%, #0e0e13); }
  .gnd { fill: color-mix(in oklab, var(--c) 22%, #0e0e13); }
  .light .sky { fill: color-mix(in oklab, var(--c) 22%, #ffffff); }
  .light .far { fill: color-mix(in oklab, var(--c) 40%, #ffffff); }
  .light .mid { fill: color-mix(in oklab, var(--c) 62%, #ffffff); }
  .light .gnd { fill: color-mix(in oklab, var(--c) 45%, #3a3a4a); }
  .px-t { font: 400 5px "Silkscreen", monospace; fill: #f4f4f8; shape-rendering: auto; }
  .px-t.hud { fill: color-mix(in oklab, var(--c) 40%, white); }
  .light .px-t.hud { fill: color-mix(in oklab, var(--c) 45%, black); }
  .px-t.pop { fill: #ffe14d; paint-order: stroke; stroke: #0e0e13; stroke-width: 1px; }

  .b1-jump { animation: b1-jump 1.8s infinite steps(1, end); }
  @keyframes b1-jump {
    0% { transform: translateY(0); } 5% { transform: translateY(-5px); } 10% { transform: translateY(-9px); } 15% { transform: translateY(-11px); }
    21% { transform: translateY(-9px); } 27% { transform: translateY(-5px); } 33%, 100% { transform: translateY(0); }
  }
  .b1-bump { animation: b1-bump 1.8s infinite steps(1, end); }
  @keyframes b1-bump { 0%, 15% { transform: translateY(0); } 16% { transform: translateY(-2px); } 22%, 100% { transform: translateY(0); } }
  .b1-coin { opacity: 0; animation: b1-coin 1.8s infinite steps(1, end); }
  @keyframes b1-coin {
    0%, 15% { opacity: 0; transform: translateY(0); } 16% { opacity: 1; transform: translateY(-3px); } 22% { transform: translateY(-6px); }
    28% { transform: translateY(-8px); } 36% { transform: translateY(-7px); } 44%, 100% { opacity: 0; }
  }
  .b1-plus { opacity: 0; animation: b1-plus 1.8s infinite steps(1, end); }
  @keyframes b1-plus { 0%, 18% { opacity: 0; transform: translateY(0); } 19% { opacity: 1; } 40% { transform: translateY(-2px); } 62%, 100% { opacity: 0; } }

  .b2-belt { animation: b2-belt 0.4s infinite steps(4, end); }
  @keyframes b2-belt { to { transform: translateX(4px); } }
  .b2-crates { transform-box: view-box; transform-origin: 0 0; animation: b2-crates 2.2s infinite steps(22, end); }
  @keyframes b2-crates { to { transform: translateX(22px); } }
  .b2-bob { animation: b2-bob 0.55s infinite steps(1, end); }
  .b2-bob.late { animation-delay: -0.27s; }
  @keyframes b2-bob { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } }
  .b2-arm { animation: b2-arm 2.2s infinite steps(1, end); }
  @keyframes b2-arm { 0%, 60% { transform: translateY(0); } 64% { transform: translateY(3px); } 76%, 100% { transform: translateY(0); } }

  .b3-gnd { transform-box: view-box; transform-origin: 0 0; animation: b3-gnd 0.4s infinite steps(8, end); }
  @keyframes b3-gnd { to { transform: translateX(-8px); } }
  .b3-hill { transform-box: view-box; transform-origin: 0 0; animation: b3-hill 4s infinite steps(40, end); }
  @keyframes b3-hill { to { transform: translateX(-40px); } }
  .b3-legA { animation: legA 0.26s infinite steps(1, end); }
  .b3-legB { animation: legB 0.26s infinite steps(1, end); }
  @keyframes legA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes legB { 0% { opacity: 0; } 50% { opacity: 1; } }
  .b3-item { transform-box: view-box; transform-origin: 0 0; animation: b3-item 2.6s infinite steps(28, end); }
  @keyframes b3-item { 0% { transform: translateX(0); opacity: 1; } 44% { transform: translateX(-56px); opacity: 1; } 45%, 100% { transform: translateX(-56px); opacity: 0; } }
  .b3-pop { opacity: 0; animation: b3-pop 2.6s infinite steps(1, end); }
  @keyframes b3-pop { 0%, 44% { opacity: 0; transform: translateY(0); } 45% { opacity: 1; } 60% { transform: translateY(-2px); } 75% { transform: translateY(-3px); } 82%, 100% { opacity: 0; } }
  .b3-ghost { opacity: 0; animation: b3-ghost 2.6s infinite steps(1, end); }
  @keyframes b3-ghost { 0%, 44% { opacity: 0; } 45%, 86% { opacity: var(--o); } 87%, 100% { opacity: 0; } }

  .b4-stars { transform-box: view-box; transform-origin: 0 0; animation: b4-stars var(--d) infinite linear; }
  @keyframes b4-stars { to { transform: translateX(-80px); } }
  .b4-bob { animation: b2-bob 0.6s infinite steps(1, end); }
  .b4-flA { animation: legA 0.14s infinite steps(1, end); }
  .b4-flB { animation: legB 0.14s infinite steps(1, end); }

  .b5-flake { transform-box: view-box; transform-origin: 0 0; opacity: 0; animation: b5-fall var(--d) var(--w) infinite steps(14, end) backwards; }
  @keyframes b5-fall {
    0% { transform: translate(calc(var(--x) * 1px), -4px); opacity: 1; }
    92% { transform: translate(calc(var(--x) * 1px), calc(var(--y) * 1px)); opacity: 1; }
    93%, 100% { transform: translate(calc(var(--x) * 1px), calc(var(--y) * 1px)); opacity: 0; }
  }
  .b5-burst { opacity: 0; animation: b5-burst var(--d) var(--w) infinite steps(1, end) backwards; }
  @keyframes b5-burst { 0%, 92% { opacity: 0; } 93%, 99% { opacity: 1; } 100% { opacity: 0; } }

  /* ================= C. Riso print ================= */
  .vc .bg { background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      var(--panel); background-blend-mode: overlay, normal; }
  .ri-h { fill: var(--c); } .ri-i { fill: var(--text); }
  .ri-hs { stroke: var(--c); fill: none; } .ri-is { stroke: var(--text); fill: none; }
  .ri-mis { mix-blend-mode: screen; }
  .light .ri-mis { mix-blend-mode: multiply; }
  .light .vc .ri-h, .light .vc .s-ht { --c-ink: color-mix(in oklab, var(--c) 82%, black); }
  .s-ht { fill: var(--c); }
  .ri-grid { stroke: var(--c); stroke-width: 0.6; opacity: 0.28; fill: none; }
  .ri-spec { font: 500 7.5px var(--mono); fill: var(--text); opacity: 0.72; }
  .ri-big { font: 800 120px var(--display); }
  .ri-mid { font: 800 44px var(--display); }
  .ri-word { font: 600 11px var(--mono); fill: var(--text); text-anchor: middle; dominant-baseline: central; }

  .c1-u { animation: c1-u 4.2s infinite; }
  .c1-i { animation: c1-i 4.2s infinite; }
  @keyframes c1-u {
    0%, 8% { transform: translate(-14px, -22px) rotate(-28deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    24%, 78% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    100% { transform: translate(-14px, -22px) rotate(-28deg); }
  }
  @keyframes c1-i {
    0%, 12% { transform: translate(18px, 14px) rotate(36deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    28%, 80% { transform: none; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    100% { transform: translate(18px, 14px) rotate(36deg); }
  }
  .c1-snap { opacity: 0; animation: c1-snap 4.2s infinite; }
  @keyframes c1-snap { 0%, 27% { opacity: 0; } 30%, 76% { opacity: 1; } 80%, 100% { opacity: 0; } }

  .c2-rot { transform-box: view-box; transform-origin: 160px 100px; animation: c2-rot 0.9s infinite; }
  @keyframes c2-rot { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); } 45%, 100% { transform: rotate(60deg); } }
  .c2-orbit { transform-box: view-box; transform-origin: 160px 100px; animation: spin 3.6s linear infinite; }
  .c2-hi { opacity: 0; animation: c2-hi 3.6s calc(var(--i) * 0.9s) infinite; }
  @keyframes c2-hi { 0% { opacity: 1; } 24% { opacity: 1; } 25%, 100% { opacity: 0; } }

  .c3-min { transform-box: view-box; transform-origin: 124px 100px; animation: c3-min 4.4s infinite; }
  @keyframes c3-min { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 44%, 100% { transform: rotate(-1440deg); } }
  .c3-hr { transform-box: view-box; transform-origin: 124px 100px; transform: rotate(0); animation: c3-hr 4.4s infinite; }
  @keyframes c3-hr { 0% { transform: rotate(120deg); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 44%, 88% { transform: rotate(0); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); } 100% { transform: rotate(120deg); } }
  .c3-stamp { animation: stamp 4.4s infinite; --from: 46%; }
  @keyframes stamp {
    0%, 46% { opacity: 0; transform: scale(1.7) rotate(-8deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    52% { opacity: 1; transform: scale(0.95) rotate(-8deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    56%, 86% { opacity: 1; transform: scale(1) rotate(-8deg); }
    92%, 100% { opacity: 0; transform: scale(1) rotate(-8deg); }
  }

  .c4-arrow { transform-box: view-box; transform-origin: 0 0; animation: c4-arrow 2.8s infinite; }
  @keyframes c4-arrow {
    0% { transform: translateX(-300px); animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
    22% { transform: translateX(6px); animation-timing-function: ease-out; }
    28%, 82% { transform: translateX(0); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    100% { transform: translateX(360px); }
  }
  .c4-trail { animation: c4-trail 2.8s infinite; }
  @keyframes c4-trail { 0%, 20% { opacity: var(--o); } 28%, 82% { opacity: 0; } 90%, 100% { opacity: var(--o); } }
  .c4-num { animation: c4-num 2.8s infinite; }
  @keyframes c4-num {
    0%, 22% { opacity: 0; transform: translateY(10px); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    32%, 80% { opacity: 1; transform: none; }
    88%, 100% { opacity: 0; transform: none; }
  }

  .c5-chk { animation: c5-chk 4.6s calc(var(--i) * 70ms) infinite backwards; }
  @keyframes c5-chk {
    0% { opacity: 0; transform: scale(1.7); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    5% { opacity: 1; transform: scale(0.9); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    9%, 80% { opacity: 1; transform: scale(1); }
    86%, 100% { opacity: 0; transform: scale(1); }
  }
  .c5-stamp { animation: c5-stamp 4.6s infinite; }
  @keyframes c5-stamp {
    0%, 30% { opacity: 0; transform: scale(1.7) rotate(-6deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
    36% { opacity: 1; transform: scale(0.95) rotate(-6deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    40%, 84% { opacity: 1; transform: scale(1) rotate(-6deg); }
    90%, 100% { opacity: 0; transform: scale(1) rotate(-6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .b1-coin, .b1-plus, .b3-pop, .c1-snap, .b5-flake { opacity: 1; }
    .a4-lines, .b3-ghost, .b5-burst { opacity: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Hero illustrations: pick a direction</h1>
  <div class="ctl">
    <button id="theme" type="button">Light</button>
    <button id="pause" type="button">Pause</button>
  </div>
</header>
<main id="root"></main>

<script>
const HUES = ["var(--ux)", "var(--cw)", "var(--ar)", "var(--ts)", "var(--ax)"];
const CAPS = [
  ["interfaces that ", "behave"],
  ["agentic setups that ", "work"],
  ["dev tools that ", "save hours"],
  ["APIs that ", "stay fast"],
  ["tests that ", "never flake"],
];

/* ---------- A. Toybox helpers ---------- */
const grad = (p, id, kind, l, m, d) =>
  kind === "r"
    ? `<radialGradient id="${p}${id}" cx=".34" cy=".28" r=".8"><stop offset="0" class="${l}"/><stop offset=".5" class="${m}"/><stop offset="1" class="${d}"/></radialGradient>`
    : `<linearGradient id="${p}${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="${l}"/><stop offset=".45" class="${m}"/><stop offset="1" class="${d}"/></linearGradient>`;
const toyDefs = (p) => `<defs>

function gear(cx, cy, r, n, d) {
  const step = (Math.PI * 2) / n;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i * step;
    for (const [rr, da] of [[r - d / 2, -0.27], [r + d / 2, -0.15], [r + d / 2, 0.15], [r - d / 2, 0.27]]) {
      pts.push(`${(cx + rr * Math.cos(a + da * step)).toFixed(2)},${(cy + rr * Math.sin(a + da * step)).toFixed(2)}`);
    }
  }
  return `M${pts.join("L")}Z`;
}

const PAL = { k: "pk", c: "pc", l: "pl", d: "pd", w: "pw", y: "py", s: "ps" };
function spr(rows, x, y, cls = "") {
  let out = "";
  rows.forEach((row, ry) => {
    let i = 0;
    while (i < row.length) {
      const ch = row[i];
      if (ch === ".") { i++; continue; }
      let j = i;
      while (j < row.length && row[j] === ch) j++;
      out += `<rect class="${PAL[ch]}" x="${x + i}" y="${y + ry}" width="${j - i}" height="1"/>`;
      i = j;
    }
  });
  return `<g class="${cls}">${out}</g>`;
}

document.getElementById("root").innerHTML = VARIANTS.map((v) => `
  <section class="v${v.key}">
    <h2><b>${v.key.toUpperCase()}</b>${v.name}</h2>
    <p>${v.note}</p>
    <div class="grid">${v.scenes.map((scene, i) => {
      const p = `t${uid++}-`;
      return `<figure style="--c:${HUES[i]}">
        <div class="stage"><div class="card">
          <div class="shadow-drop"></div><div class="bg"></div>
          <svg viewBox="${v.vb}" aria-hidden="true">${scene(p)}</svg>
          <div class="fx"></div>
        </div></div>
        <figcaption>I build ${CAPS[i][0]}<b>${CAPS[i][1]}</b>.</figcaption>
      </figure>`;
    }).join("")}</div>
  </section>`).join("");

/* Theme and pause */
const html = document.documentElement;
const themeBtn = document.getElementById("theme");
const setTheme = (light) => { html.classList.toggle("light", light); themeBtn.textContent = light ? "Dark" : "Light"; };
setTheme(new URLSearchParams(location.search).get("theme") === "light");
themeBtn.onclick = () => setTheme(!html.classList.contains("light"));
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => { const on = document.body.classList.toggle("paused"); pauseBtn.textContent = on ? "Play" : "Pause"; };

/* Every card turns toward the cursor, closing 12% of the gap each frame. */
const REST = { x: 4, y: -6 };
const cards = [...document.querySelectorAll(".card")].map((el) => ({ el, now: { ...REST }, to: { ...REST } }));
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let frame = 0;
  const clamp = (v) => Math.max(-1, Math.min(1, v));
  const tick = () => {
    let moving = false;
    for (const c of cards) {
      c.now.x += (c.to.x - c.now.x) * 0.12;
      c.now.y += (c.to.y - c.now.y) * 0.12;
      if (Math.abs(c.to.x - c.now.x) > 0.01 || Math.abs(c.to.y - c.now.y) > 0.01) moving = true;
      c.el.style.transform = `rotateX(${c.now.x.toFixed(2)}deg) rotateY(${c.now.y.toFixed(2)}deg)`;
    }
    frame = moving ? requestAnimationFrame(tick) : 0;
  };
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    for (const c of cards) {
      const r = c.el.parentElement.getBoundingClientRect();
      const dx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth / 2));
      const dy = clamp((e.clientY - (r.top + r.height / 2)) / (innerHeight / 2));
      c.to = { x: REST.x - dy * 10, y: REST.y + dx * 14 };
    }
    if (!frame) frame = requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
