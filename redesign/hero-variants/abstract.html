<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero illustrations: abstract Riso</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0e13; --panel: #17171f; --panel-2: #20202b; --hair: #2c2c3a;
    --text: #f4f4f8; --dim: #a1a1b5; --go: #ffe14d;
    --ux: #ff6ad5; --cw: #4dd4ff; --ar: #ffb02e; --ts: #7dff6a; --ax: #9d7bff;
    --shade: rgb(0 0 0 / 0.45);
    --display: "Unbounded", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  .light {
    --bg: #f5f5f8; --panel: #ffffff; --panel-2: #ececf2; --hair: #d6d6df;
    --text: #111117; --dim: #4b4b5b; --shade: rgb(30 30 60 / 0.18);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 "Geist", system-ui, sans-serif; }
  .ctl { display: flex; gap: 8px; padding: 16px clamp(16px, 4vw, 48px) 0; max-width: 1240px; margin: 0 auto; }
  .ctl button { font: 700 12px var(--display); padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--panel-2); color: var(--text); box-shadow: 0 3px 0 var(--hair); }
  .ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hair); }
  main { padding: 0 clamp(16px, 4vw, 48px) 64px; max-width: 1240px; margin: 0 auto; }
  section { padding-top: 32px; }
  section h2 { margin: 0; font: 800 clamp(20px, 2.6vw, 26px)/1.1 var(--display); }
  section h2 b { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; margin-right: 10px; border-radius: 9px;
    background: var(--go); color: #111; font-size: 0.7em; vertical-align: 0.12em; }
  section > p { margin: 8px 0 18px; color: var(--dim); max-width: 66ch; font-size: 15px; }
  .row { display: grid; gap: 24px 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
  figure { margin: 0; }
  figcaption { margin-top: 9px; font: 500 12.5px var(--mono); color: var(--dim); }
  figcaption b { color: var(--c); font-weight: 600; }
  .light figcaption b { color: color-mix(in oklab, var(--c) 70%, black); }

  .stage { perspective: 900px; }
  .card { position: relative; aspect-ratio: 16 / 10; transform-style: preserve-3d; transform: rotateX(4deg) rotateY(-6deg); }
  .card > * { position: absolute; inset: 0; border-radius: 14px; }
  .card .paper { border: 1px solid var(--hair);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      var(--panel);
    background-blend-mode: overlay, normal; }
  .card svg, .card canvas { width: 100%; height: 100%; transform: translateZ(30px); clip-path: inset(0 round 14px); display: block; }
  .card .drop { transform: translateZ(-1px) translateY(10px); background: var(--shade); filter: blur(14px); opacity: .7; }
  svg *:not([transform]) { transform-box: fill-box; transform-origin: center; }
  .paused .card * { animation-play-state: paused !important; }

  .h { fill: var(--c); } .i { fill: var(--text); }
  .hs { stroke: var(--c); fill: none; } .is { stroke: var(--text); fill: none; }
  .mis { mix-blend-mode: screen; }
  .light .mis { mix-blend-mode: multiply; }
  .dot { fill: var(--c); }
  .grid { stroke: var(--c); stroke-width: 0.6; opacity: 0.26; fill: none; }

  /* ---- D. Primitives ---- */
  /* Scattered and turned at rest, the shape springs into its place in the composition. */
  .settle { animation: settle var(--T, 4.4s) calc(var(--i, 0) * var(--gap, 120ms)) infinite backwards; }
  @keyframes settle {
    0%, 6% { transform: translate(var(--dx), var(--dy)) rotate(var(--r, 0deg)); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    24%, 80% { transform: none; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r, 0deg)); }
  }
  .d2-ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: d2-ring 4.4s infinite; }
  @keyframes d2-ring {
    0%, 40% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    54%, 80% { stroke-dashoffset: 0; opacity: 1; }
    88%, 100% { stroke-dashoffset: 0; opacity: 0; }
  }
  .card .d3-bar { transform-origin: 50% 100%; animation: d3-bar 4.4s calc(var(--i) * 90ms) infinite backwards; }
  @keyframes d3-bar {
    0%, 8% { transform: scaleY(1); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    24%, 80% { transform: scaleY(0.16); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    96%, 100% { transform: scaleY(1); }
  }
  .d3-disc { animation: d3-disc 4.4s infinite; }
  @keyframes d3-disc {
    0%, 22% { opacity: 0; transform: translateY(30px) scale(0.6); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    34%, 76% { opacity: 1; transform: none; animation-timing-function: ease-in; }
    84%, 100% { opacity: 0; transform: translateY(30px) scale(0.6); }
  }
  .d4-lvl { opacity: 0; animation: d4-lvl 4.8s calc(var(--i) * 1.6s) infinite backwards; }
  @keyframes d4-lvl {
    0% { opacity: 0; transform: scale(0.97); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    9%, 33% { opacity: 1; transform: none; }
    42%, 100% { opacity: 0; transform: none; }
  }
  .card .d5-ball { transform-origin: 50% 100%; animation: d5-ball 2.6s infinite; }
  @keyframes d5-ball {
    0% { opacity: 0; transform: translateY(-130px); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
    6% { opacity: 1; }
    26% { transform: translateY(0) scale(1.12, 0.86); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    34%, 82% { opacity: 1; transform: none; }
    94%, 100% { opacity: 0; transform: none; }
  }
  .d5-hit { opacity: 0; animation: d5-hit 2.6s infinite; }
  @keyframes d5-hit { 0%, 25% { opacity: 0; transform: scale(0.8); } 28% { opacity: 1; } 44%, 100% { opacity: 0; transform: scale(1.5); } }

  @media (prefers-reduced-motion: reduce) {
    .card * { animation: none !important; }
    .d2-ring { stroke-dashoffset: 0; }
    .d3-disc { opacity: 1; }
    .card .d3-bar { transform: scaleY(0.16); }
    .d4-lvl.l3 { opacity: 1; }
  }
</style>
</head>
<body>
<div class="ctl">
  <button id="theme" type="button">Light</button>
  <button id="pause" type="button">Pause</button>
</div>
<main id="root"></main>

<script>
const SLIDES = [
  { c: "var(--ux)", phrase: "interfaces that ", hi: "feel right" },
  { c: "var(--cw)", phrase: "agents that ", hi: "finish the job" },
  { c: "var(--ar)", phrase: "dev tools that ", hi: "save hours" },
  { c: "var(--ts)", phrase: "backends that ", hi: "scale quietly" },
  { c: "var(--ax)", phrase: "test suites you ", hi: "can trust" },
];

const defs = (p) => `<defs>
  <pattern id="${p}ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle class="dot" cx="2.5" cy="2.5" r="1.75"/></pattern>
  <pattern id="${p}gr" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0 H0 V16"/></pattern>
</defs><rect width="320" height="200" fill="url(#${p}gr)"/>`;
// One primitive printed in two inks: a misregistered halftone in the hue, then the top ink.
const ink = (p, shape, top = "i") => {
  const topG = top === "i" ? `<g class="i">${shape}</g>` : top === "h" ? `<g class="h mis">${shape}</g>` : `<g class="is" stroke-width="3">${shape}</g>`;
  return `<g transform="translate(5 4)" fill="url(#${p}ht)" class="mis">${shape}</g>${topG}`;
};
const set = (vars) => Object.entries(vars).map(([k, v]) => `--${k}:${v}`).join(";");

/* ================= D. Primitives ================= */
const primitives = [
  // Feel right: four tumbling primitives settle into one balanced composition.
  (p) => `${defs(p)}
    <g class="settle" style="${set({ i: 0, dx: "-70px", dy: "-46px", r: "-38deg" })}">${ink(p, `<rect x="96" y="56" width="84" height="84"/>`)}</g>
    <g class="settle" style="${set({ i: 1, dx: "-40px", dy: "44px", r: "16deg" })}">${ink(p, `<rect x="64" y="150" width="200" height="16"/>`)}</g>
    <g class="settle" style="${set({ i: 2, dx: "64px", dy: "-90px", r: "70deg" })}">${ink(p, `<path d="M226 150 L266 150 L246 112 Z"/>`, "o")}</g>
    <g class="settle" style="${set({ i: 3, dx: "80px", dy: "58px" })}">${ink(p, `<circle cx="212" cy="68" r="34"/>`, "h")}</g>`,

  // Finish the job: four quarters arrive one at a time and close into a whole disc.
  (p) => {
    const q = [
      ["M160 100 V30 A70 70 0 0 1 230 100 Z", "70px", "-56px", "40deg", "i"],
      ["M160 100 H230 A70 70 0 0 1 160 170 Z", "84px", "48px", "-30deg", "h"],
      ["M160 100 V170 A70 70 0 0 1 90 100 Z", "-72px", "52px", "50deg", "i"],
      ["M160 100 H90 A70 70 0 0 1 160 30 Z", "-84px", "-50px", "-40deg", "h"],
    ];
    return `${defs(p)}
    ${q.map(([d, dx, dy, r, top], i) => `<g class="settle" style="${set({ i, gap: "240ms", dx, dy, r })}">${ink(p, `<path d="${d}"/>`, top)}</g>`).join("")}
    <path class="is d2-ring" pathLength="1" stroke-width="3" d="M160 14 A86 86 0 1 1 159.99 14"/>`;
  },

  // Save hours: four tall bars crunch down and a disc rises into the time they gave back.
  (p) => `${defs(p)}
    ${[66, 106, 146, 186].map((x, i) => `<g class="d3-bar" style="--i:${i}">${ink(p, `<rect x="${x}" y="26" width="30" height="144"/>`, i % 2 ? "h" : "i")}</g>`).join("")}
    <g class="d3-disc"><circle cx="146" cy="88" r="56" fill="url(#${p}ht)" class="mis"/><circle cx="141" cy="84" r="56" class="is" stroke-width="3"/></g>
    <path class="is" stroke-width="3" d="M40 172 H280"/>
    ${ink(p, `<circle cx="262" cy="46" r="12"/>`, "h")}`,

  // Scale quietly: one square becomes 4, then 16, with the same total area each time.
  (p) => {
    const lvl = (n, i) => {
      const gap = 4, s = (160 - gap * (n - 1)) / n;
      let cells = "";
      for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) cells += `<rect x="${80 + a * (s + gap)}" y="${20 + b * (s + gap)}" width="${s}" height="${s}"/>`;
      return `<g class="d4-lvl l${i + 1}" style="--i:${i}">${ink(p, cells, "o")}</g>`;
    };
    return `${defs(p)}${lvl(1, 0)}${lvl(2, 1)}${lvl(4, 2)}`;
  },

  // Can trust: the ball lands on the level beam inside its own ghost, every time.
  (p) => `${defs(p)}
    ${ink(p, `<path d="M160 156 L182 190 L138 190 Z"/>`)}
    ${ink(p, `<rect x="56" y="146" width="208" height="10"/>`, "h")}
    <circle cx="160" cy="122" r="31" class="is" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <circle cx="160" cy="122" r="40" class="hs" stroke-width="1.4" stroke-dasharray="1 5" opacity=".6"/>
    <circle class="hs d5-hit" stroke-width="2" cx="160" cy="146" r="20"/>
    <g class="d5-ball">${ink(p, `<circle cx="160" cy="122" r="24"/>`)}</g>`,
];

/* ================= E. Dot field ================= */
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const smooth = (v) => { v = clamp01(v); return v * v * (3 - 2 * v); };
const sstep = (a, b, v) => smooth((v - a) / (b - a));
const TAU = Math.PI * 2;
// Smooth value noise: hashed lattice corners, blended with smoothstep.
const hash = (i, j) => { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); };
const vnoise = (x, y) => {
  const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
  const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
};

const fields = [
  // Feel right: noise resolves into a crisp disc, holds, and loosens again.
  { T: 4.4, rest: 2.0, frame(t) {
      const ph = (t % this.T) / this.T;
      const m = sstep(0.1, 0.3, ph) * (1 - sstep(0.8, 0.96, ph));
      return (x, y) => {
        const n = 0.12 + 0.75 * vnoise(x / 34 + t * 0.35, y / 34 - t * 0.2);
        const d = Math.hypot(x - 160, y - 100);
        const disc = (1 - sstep(68, 76, d)) * (0.92 + 0.08 * Math.cos(d * 0.2));
        return n * 0.8 * (1 - m) + disc * m;
      };
  } },
  // Finish the job: a front sweeps across, everything behind it is filled.
  { T: 3.8, rest: 3.0, frame(t) {
      const ph = (t % this.T) / this.T;
      const fx = -40 + smooth(ph / 0.66) * 420;
      const fade = 1 - sstep(0.84, 0.98, ph);
      return (x, y) => {
        if (x < 28 || x > 292 || y < 24 || y > 176) return 0.08;
        const f = fx + (y - 100) * 0.35;
        const v = x < f - 18 ? 0.95 : 0.16 + 0.79 * clamp01((f - x) / 18);
        return 0.16 + (v - 0.16) * fade;
      };
  } },
  // Save hours: a clock wedge sweeps backwards and gives most of the circle back.
  { T: 4.4, rest: 2.6, frame(t) {
      const ph = (t % this.T) / this.T;
      const s = TAU - (TAU - 0.55) * smooth((ph - 0.12) / 0.42) + (TAU - 0.55) * sstep(0.84, 1, ph);
      return (x, y) => {
        const dx = x - 160, dy = y - 100, d = Math.hypot(dx, dy);
        if (d > 92) return 0.05;
        if (d > 84) return 0.75;
        let a = Math.atan2(dx, -dy); if (a < 0) a += TAU;
        return a < s ? 1 : 0.13;
      };
  } },
  // Scale quietly: one blob divides into 2, 4, 8 without growing.
  { T: 4.8, rest: 3.9, frame(t) {
      const ph = (t % this.T) / this.T, k = Math.floor(ph * 4), e = smooth(((ph * 4) % 1) / 0.32);
      const offs = [[0, 0], [62, 0], [0, 42], [31, 0]];
      const pos = (level, idx) => {
        let x = 160, y = 100;
        for (let l = 1; l <= level; l++) { const s = (idx >> (level - l)) & 1 ? 1 : -1; x += s * offs[l][0]; y += s * offs[l][1]; }
        return [x, y];
      };
      const R = (lv) => 58 / Math.sqrt(2 ** lv);
      const blobs = [];
      for (let i = 0; i < 8; i++) {
        let from, to, r;
        if (k === 0) { from = pos(3, i); to = [160, 100]; r = R(3) + (R(0) - R(3)) * e; }
        else { const n = 2 ** k; const j = Math.floor(i * n / 8); from = pos(k - 1, j >> 1); to = pos(k, j); r = R(k - 1) + (R(k) - R(k - 1)) * e; }
        blobs.push([from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e, r]);
      }
      return (x, y) => {
        let v = 0.06;
        for (const [bx, by, r] of blobs) v = Math.max(v, 1 - sstep(r * 0.72, r * 1.12, Math.hypot(x - bx, y - by)));
        return v;
      };
  } },
  // Can trust: the same ring, at the same pace, from a steady core.
  { T: 2, rest: 0.5, frame(t) {
      return (x, y) => {
        const d = Math.hypot(x - 160, y - 100);
        if (d < 18) return 1;
        if (d > 104) return 0.05;
        const wave = 0.5 + 0.5 * Math.cos((d - 18) * 0.16 - t * Math.PI * 2 / this.T * 2);
        return 0.08 + wave * 0.92 * (1 - (d - 18) / 100);
      };
  } },
];

/* ================= F. Slats ================= */
let seed = 7;
const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const ROWS = 16, ROW_Y = (r) => 13 + r * 11, ROW_H = 8;
const rows = (fn) => Array.from({ length: ROWS }, (_, r) => fn(r, ROW_Y(r) + ROW_H / 2));
const one = (x, w, x2 = x + w / 2) => [[x, w], [x2, 0]];
const half = (R, yc, cy = 100) => Math.sqrt(Math.max(0, R * R - (yc - cy) ** 2));

const slatScenes = [
  // Feel right: ragged slats slide into a circle.
  (() => {
    seed = 11;
    const ragged = rows(() => one(20 + rand() * 150, 30 + rand() * 120));
    const circle = rows((r, y) => { const h = half(90, y); return one(160 - h, 2 * h); });
    return { poses: [ragged, circle], seq: [[0, 700], [1, 1900]], rest: 1, top: (r) => (r % 5 === 2 ? "h" : "i") };
  })(),
  // Finish the job: a loading slash turns into a check.
  (() => {
    const longX = (y) => 124 + (176 - y) * (148 / 154);
    const shortX = (y) => 52 + (y - 108) * (72 / 68);
    const check = rows((r, y) => [
      y >= 14 && y <= 186 ? [longX(y) - 17, 34] : [longX(y), 0],
      y >= 100 && y <= 180 ? [shortX(Math.min(y, 176)) - 17, 34] : [shortX(140), 0],
    ]);
    const slash = rows((r, y) => [[56 + r * 13, 24], [check[r][1][0] + 17, 0]]);
    return { poses: [slash, check], seq: [[0, 600], [1, 1900]], rest: 1, top: (r) => (r > 9 ? "h" : "i") };
  })(),
  // Save hours: long timeline bars compress into short ones.
  (() => {
    seed = 23;
    const xs = rows(() => 34);
    const long = rows((r) => one(xs[r], 190 + rand() * 76));
    const short = rows((r) => one(xs[r], 22 + rand() * 30));
    return { poses: [long, short], seq: [[0, 1100], [1, 1700]], rest: 1, top: (r) => (r % 4 === 1 ? "h" : "i") };
  })(),
  // Scale quietly: one slat becomes 4, then 16, then two columns.
  (() => {
    const show = (on) => rows((r) => (on(r) ? one(126, 68) : one(126, 0, 160)));
    const p1 = show((r) => r === 7), p4 = show((r) => r >= 6 && r <= 9), p16 = show(() => true);
    const p32 = rows(() => [[58, 92], [170, 92]]);
    return { poses: [p1, p4, p16, p32], seq: [[0, 700], [1, 700], [2, 700], [3, 1500]], rest: 3, dur: 640,
      ease: [0.16, 1, 0.3, 1], top: (r) => (r % 3 === 0 ? "h" : "i") };
  })(),
  // Can trust: every row runs to the same end line, then all reset together.
  (() => {
    const empty = rows(() => one(30, 0, 30)), full = rows(() => one(30, 262, 30));
    return { poses: [empty, full], seq: [[0, 380, 0], [1, 1500, 88]], rest: 1, top: () => "i", endLine: 292 };
  })(),
];

// Cubic-bezier timing, solved by bisection (good enough at 30 steps).
const bezier = ([x1, y1, x2, y2]) => (t) => {
  const bx = (s) => 3 * x1 * s * (1 - s) ** 2 + 3 * x2 * s * s * (1 - s) + s ** 3;
  const by = (s) => 3 * y1 * s * (1 - s) ** 2 + 3 * y2 * s * s * (1 - s) + s ** 3;
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (bx(m) < t) lo = m; else hi = m; }
  return by((lo + hi) / 2);
};

function slatSvg(p, scene) {
  let out = defs(p);
  if (scene.endLine) out += `<path class="hs" stroke-width="1.6" stroke-dasharray="3 3" d="M${scene.endLine + 0.5} 6 V194"/>`;
  for (let r = 0; r < ROWS; r++) {
    for (let s = 0; s < 2; s++) {
      out += `<rect data-r="${r}" data-s="${s}" data-l="ht" y="${ROW_Y(r) + 3}" height="${ROW_H}" fill="url(#${p}ht)" class="mis"/>`;
      out += `<rect data-r="${r}" data-s="${s}" data-l="top" y="${ROW_Y(r)}" height="${ROW_H}" class="${scene.top(r) === "h" ? "h mis" : "i"}"/>`;
    }
  }
  return out;
}

/* ================= Page ================= */
const VARIANTS = [
  { key: "d", name: "Primitives", note: "Circle, square, triangle and bar only. Each headline is a composition that settles: shapes landing in balance, quarters closing a disc, tall bars crunching to give a disc room, a square dividing, a ball landing in its own ghost." },
  { key: "e", name: "Dot field", note: "One halftone lattice per card; the size of each dot is the whole picture. Noise resolves into a disc, a front fills the field, a clock wedge sweeps backwards, a blob divides, and the same ring pulses at the same pace." },
  { key: "f", name: "Slats", note: "Everything is built from sixteen printed slats that slide row by row: ragged into a circle, a loading slash into a check, long bars compressed, one slat multiplying into columns, every row running to the same end line." },
];

let uid = 0;
const cardHtml = (inner, i) => `
  <figure style="--c:${SLIDES[i].c}">
    <div class="stage"><div class="card"><div class="drop"></div><div class="paper"></div>${inner}</div></div>
    <figcaption>I build ${SLIDES[i].phrase}<b>${SLIDES[i].hi}</b>.</figcaption>
  </figure>`;
document.getElementById("root").innerHTML = VARIANTS.map((v) => `
  <section class="v${v.key}">
    <h2><b>${v.key.toUpperCase()}</b>${v.name}</h2>
    <p>${v.note}</p>
    <div class="row">${[0, 1, 2, 3, 4].map((i) => {
      const p = `u${uid++}-`;
      if (v.key === "d") return cardHtml(`<svg viewBox="0 0 320 200" aria-hidden="true">${primitives[i](p)}</svg>`, i);
      if (v.key === "e") return cardHtml(`<canvas data-field="${i}" aria-hidden="true"></canvas>`, i);
      return cardHtml(`<svg viewBox="0 0 320 200" data-slats="${i}" aria-hidden="true">${slatSvg(p, slatScenes[i])}</svg>`, i);
    }).join("")}</div>
  </section>`).join("");

const html = document.documentElement;
const themeBtn = document.getElementById("theme");
const setTheme = (light) => { html.classList.toggle("light", light); themeBtn.textContent = light ? "Dark" : "Light"; };
setTheme(new URLSearchParams(location.search).get("theme") === "light");
themeBtn.onclick = () => setTheme(!html.classList.contains("light"));
let paused = false;
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => { paused = !paused; document.body.classList.toggle("paused", paused); pauseBtn.textContent = paused ? "Play" : "Pause"; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* One loop drives the dot fields and the slats. Its clock stops while paused. */
const dotCards = [...document.querySelectorAll("canvas[data-field]")].map((canvas) => ({ canvas, field: fields[+canvas.dataset.field], fig: canvas.closest("figure") }));
const slatCards = [...document.querySelectorAll("svg[data-slats]")].map((svg) => {
  const scene = slatScenes[+svg.dataset.slats];
  const rects = [...svg.querySelectorAll("rect[data-r]")].map((el) => ({ el, r: +el.dataset.r, s: +el.dataset.s }));
  const ease = bezier(scene.ease || [0.65, 0, 0.35, 1]);
  const dur = scene.dur || 520;
  const steps = scene.seq.map(([pose, hold, stagger = 69]) => ({ pose, hold, stagger, len: dur + stagger * (ROWS - 1) + hold }));
  const total = steps.reduce((a, s) => a + s.len, 0);
  return { scene, rects, ease, dur, steps, total };
});

function drawDots({ canvas, field, fig }, t) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext("2d");
  const k = (w * dpr) / 320;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, 320, 200);
  const cs = getComputedStyle(fig);
  const hue = cs.getPropertyValue("--c").trim(), text = cs.getPropertyValue("--text").trim();
  const f = field.frame(t);
  const vals = [];
  ctx.fillStyle = hue;
  ctx.beginPath();
  for (let gy = 0; gy < 25; gy++) for (let gx = 0; gx < 40; gx++) {
    const x = 4 + gx * 8, y = 4 + gy * 8, v = clamp01(f(x, y));
    vals.push(v);
    const r = 3.7 * v;
    if (r > 0.3) { ctx.moveTo(x + 1.4 + r, y + 1.1); ctx.arc(x + 1.4, y + 1.1, r, 0, TAU); }
  }
  ctx.fill();
  ctx.fillStyle = text;
  ctx.beginPath();
  vals.forEach((v, n) => {
    if (v < 0.6) return;
    const x = 4 + (n % 40) * 8, y = 4 + Math.floor(n / 40) * 8, r = ((v - 0.6) / 0.4) * 2.1;
    if (r > 0.2) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  });
  ctx.fill();
}

function drawSlats(card, ms) {
  const { scene, rects, ease, dur, steps, total } = card;
  let t = ms % total, i = 0;
  while (t >= steps[i].len) { t -= steps[i].len; i++; }
  const step = steps[i], from = scene.poses[steps[(i - 1 + steps.length) % steps.length].pose], to = scene.poses[step.pose];
  for (const { el, r, s } of rects) {
    const e = ease(clamp01((t - r * step.stagger) / dur));
    const [fx, fw] = from[r][s], [tx, tw] = to[r][s];
    const w = fw + (tw - fw) * e;
    el.setAttribute("x", (fx + (tx - fx) * e + (el.dataset.l === "ht" ? 4 : 0)).toFixed(2));
    el.setAttribute("width", Math.max(0, w).toFixed(2));
  }
}
function restSlats(card) {
  const pose = card.scene.poses[card.scene.rest];
  for (const { el, r, s } of card.rects) {
    el.setAttribute("x", pose[r][s][0] + (el.dataset.l === "ht" ? 4 : 0));
    el.setAttribute("width", pose[r][s][1]);
  }
}

if (reduced) {
  const still = () => { dotCards.forEach((c) => drawDots(c, c.field.rest)); slatCards.forEach(restSlats); };
  still();
  new MutationObserver(still).observe(html, { attributes: true, attributeFilter: ["class"] });
  addEventListener("resize", still);
} else {
  let clock = 0, last = performance.now();
  const loop = (now) => {
    if (!paused) clock += now - last;
    last = now;
    dotCards.forEach((c) => drawDots(c, clock / 1000));
    slatCards.forEach((c) => drawSlats(c, clock));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* Every card turns toward the cursor, closing 12% of the gap each frame. */
const REST = { x: 4, y: -6 };
const cards = [...document.querySelectorAll(".card")].map((el) => ({ el, now: { ...REST }, to: { ...REST } }));
if (!reduced) {
  let frame = 0;
  const clamp = (v) => Math.max(-1, Math.min(1, v));
  const tick = () => {
    let moving = false;
    for (const c of cards) {
      c.now.x += (c.to.x - c.now.x) * 0.12;
      c.now.y += (c.to.y - c.now.y) * 0.12;
      if (Math.abs(c.to.x - c.now.x) > 0.01 || Math.abs(c.to.y - c.now.y) > 0.01) moving = true;
      c.el.style.transform = `rotateX(${c.now.x.toFixed(2)}deg) rotateY(${c.now.y.toFixed(2)}deg)`;
    }
    frame = moving ? requestAnimationFrame(tick) : 0;
  };
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    for (const c of cards) {
      const r = c.el.parentElement.getBoundingClientRect();
      const dx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth / 2));
      const dy = clamp((e.clientY - (r.top + r.height / 2)) / (innerHeight / 2));
      c.to = { x: REST.x - dy * 10, y: REST.y + dx * 14 };
    }
    if (!frame) frame = requestAnimationFrame(tick);
  });
}
</script>
</body>
</html>
